name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: make lint

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make build

      - name: Verify MT5 layer
        run: bash tests/test_mt5_layer.sh

      - name: Runtime smoke test
        run: bash tests/test_smoke.sh

      - name: Compile & test toolchain
        run: bash tests/test_toolchain.sh

      - name: First-boot setup (user + MT5 cron)
        run: bash tests/test_setup_cron.sh

      - name: MT5 auto-upgrade logic
        run: docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint /bin/bash xfcevdi:dev -c 'bash /tests/test_mt5_install.sh'
