# supervisord-mt5.conf - production runtime for xfcevdi_mt5 (7x24)
# Programs: sshd, Xvfb, mt5 (terminal64.exe under Wine), mt5_guard (Mojo).

[unix_http_server]
file=/run/supervisord.sock
chmod=0770
chown=root:trader

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=10
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/sshd.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
redirect_stderr=true
priority=10

[program:Xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp
environment=HOME="/home/trader",USER="trader",DISPLAY=":99"
user=trader
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvfb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
redirect_stderr=true
priority=20

[program:mt5]
command=wine terminal64.exe
directory=/home/trader/.mt5/drive_c/Program Files/MetaTrader 5
environment=HOME="/home/trader",USER="trader",DISPLAY=":99",WINEPREFIX="/home/trader/.mt5",HTTP_PROXY="http://172.17.0.1:1080",HTTPS_PROXY="http://172.17.0.1:1080"
user=trader
autostart=true
autorestart=true
startsecs=8
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/var/log/supervisor/mt5.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
redirect_stderr=true
priority=30

[program:mt5_guard]
command=/opt/mojo-rt/mt5_guard 10 120
environment=HOME="/home/trader",USER="trader",LD_LIBRARY_PATH="/opt/mojo-rt"
user=trader
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/guard.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
redirect_stderr=true
priority=40

[group:mt5-stack]
programs=sshd,Xvfb,mt5,mt5_guard
priority=5
