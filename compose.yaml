services:
  xfcevdi:
    build: .
    image: xfcevdi:prod
    tty: true
    container_name: xfcevdi_mt5
    restart: unless-stopped
    environment:
      USERNAME: trader
      PASS: abc
      MT5_INSTALL: "yes"
      MT5_AUTOUPDATE: "yes"
      # Broker-branded installer (IC Markets SC5); staged from the repo mount
      # instead of the MetaQuotes CDN by mt5-install (see scripts/mt5-install.sh).
      MT5_SETUP_LOCAL: /opt/mt5-setup/icmarketssc5setup.exe
    volumes:
      # Persistent home (includes the trader Wine prefix ~/.mt5 with MT5).
      # Mounted from the parent quant_mt5 repo so xfcevdi stays pure infra.
      - ../../runtime/home_storage:/home
      # Local MT5 installer sources (gitignored in the parent repo). Mounted so
      # mt5-install can stage the broker-branded IC Markets SC5 build.
      - ../../data/downloads:/opt/mt5-setup:ro
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 2048000000 # 2GB
    ports:
      # SSH host port: default 63774 (derived from machine-id); override via SSH_PORT=<n>
      - "${SSH_PORT:-63774}:22"
    # 7x24 log hygiene: rotate the docker json-file log so it cannot grow
    # without bound over months of continuous operation.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # Healthy only when:
      # 1. health.json says ok=true (MT5 and Xvfb both alive)
      # 2. health.json was written within the last 60s (guard is responsive,
      #    prevents a frozen-but-stale file from masking a dead guard)
      test:
        - CMD-SHELL
        - >-
          grep -q '"ok":true' /home/trader/.mt5/control/health.json 2>/dev/null
          && test $(( $(date +%s) - $(stat -c %Y /home/trader/.mt5/control/health.json 2>/dev/null || echo 0) )) -lt 60
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  xfce_vdi_network:
