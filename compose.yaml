version: "3.8"

services:
  xfcevdi:
    build: .
    image: xfcevdi:dev
    tty: true
    container_name: xfcevdi_mt5
    restart: unless-stopped
    environment:
      USERNAME: trader
      PASS: abc
      # MetaTrader 5 auto-install / auto-update switches
      MT5_INSTALL: "yes"
      MT5_AUTOUPDATE: "yes"
      # MT5_SETUP_URL: https://your-mirror/mt5setup.exe   # if MetaQuotes CDN is blocked
    volumes:
      # Persistent home (includes the user's Wine prefix ~/.mt5 with MT5)
      - ./home_storage:/home
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 2048000000 # 2GB
    ports:
      - "2222:22"

networks:
  xfce_vdi_network:
